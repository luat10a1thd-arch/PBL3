<!doctype html>
<html lang="vi">
  <head>
    <base href="/app/">
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
    />
    <title>Bán Hàng - Cafe 24/7</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="cashier-page dash-bg-wrapper">
    <div class="dash-bg-overlay"></div>

    <!-- Top navigation bar -->
    <header class="cashier-topbar">
      <div class="cashier-topbar-brand">
        <i class="fa-solid fa-mug-saucer cashier-topbar-brand-icon"></i>
        <span class="cashier-topbar-brand-name">CAFE 24/7</span>
      </div>

      <div class="cashier-topbar-shift">
        <div class="cashier-topbar-shift-dot"></div>
        <span id="cashierShiftStatus">Đang kiểm tra ca...</span>
      </div>

      <nav class="cashier-topbar-tabs">
        <a href="/app/cashier" class="cashier-topbar-tab">
          <i class="fa-solid fa-cash-register"></i>
          <span>Bán Hàng</span>
        </a>
        <a href="/app/cashier/shift" class="cashier-topbar-tab">
          <i class="fa-solid fa-file-invoice-dollar"></i>
          <span>Chốt Ca</span>
        </a>
        <a href="/app/cashier/inventory" class="cashier-topbar-tab">
          <i class="fa-solid fa-box-open"></i>
          <span>Xuất Kho</span>
        </a>
      </nav>

      <div class="cashier-topbar-right">
        <div class="cashier-topbar-user">
          <div class="cashier-topbar-avatar" id="txtCurrentUserAvatar">TN</div>
          <div>
            <div class="cashier-topbar-user-name" id="txtCurrentUserName">Nhân Viên</div>
            <div class="cashier-topbar-user-role" id="txtCurrentUserRole">Staff</div>
          </div>
        </div>
        <a href="/app/login" class="cashier-topbar-logout">
          <i class="fa-solid fa-right-from-bracket"></i>
          Đăng Xuất
        </a>
      </div>
    </header>

    <!-- Main content -->
    <div class="cashier-body">
      <div class="cashier-layout">
        <!-- Left: Menu Grid -->
        <div class="cashier-menu-panel">
          <div class="cashier-menu-filter">
            <div class="cashier-menu-filter-header">
              <h3 class="cashier-menu-filter-title">Thực Đơn</h3>
            </div>
            <div class="cashier-category-tabs">
              <!-- Category tabs will be dynamically loaded by JavaScript -->
            </div>
          </div>

          <div class="cashier-menu-grid">
            <!-- Items will be dynamically loaded by JavaScript -->
          </div>
        </div>

        <!-- Right: Order Summary -->
        <aside class="cashier-order-panel">
          <div class="cashier-order-header">
            <div>
              <h2 class="cashier-order-title">Đơn Hàng Hiện Tại</h2>
              <span class="cashier-order-meta">Mã #— &bull; Tại quầy</span>
            </div>
            <button class="cashier-order-clear-btn" title="Xoá tất cả">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </div>

          <div class="cashier-order-tools">
            <div class="cashier-voucher-row">
              <input
                type="text"
                id="cashierVoucherInput"
                class="cashier-voucher-input"
                placeholder="Nhập mã giảm giá..."
              />
              <button class="cashier-voucher-btn" id="cashierApplyVoucherBtn">
                Áp mã
              </button>
            </div>
            <div class="cashier-voucher-note">Chưa áp mã giảm giá</div>
          </div>

          <!-- Banner cảnh báo chưa mở ca -->
          <div
            id="shiftWarningBanner"
            style="
              display: none;
              background: linear-gradient(135deg, rgba(239,68,68,.12), rgba(239,68,68,.04));
              border: 1px solid rgba(239,68,68,.3);
              border-radius: 8px;
              padding: 10px 14px;
              margin: 8px 14px 0;
              font-size: .82rem;
              color: #fca5a5;
              gap: 8px;
              align-items: center;
            "
          >
            <i class="fa-solid fa-triangle-exclamation" style="color:#ef4444;"></i>
            Chưa mở ca &mdash; không thể thanh toán.
          </div>

          <div class="cashier-order-items" id="cashierOrderItems">
            <!-- Đơn hàng sẽ được render bởi JS -->
          </div>

          <div class="cashier-order-totals">
            <div class="cashier-total-row">
              <span class="label">Tạm Tính</span>
              <span class="value" id="cashierSubtotalValue">0₫</span>
            </div>
            <div class="cashier-total-row">
              <span class="label">VAT (8%)</span>
              <span class="value" id="cashierVatValue">0₫</span>
            </div>
            <div class="cashier-total-row">
              <span class="label">Giảm Giá</span>
              <span class="value text-success" id="cashierDiscountValue">- 0₫</span>
            </div>
            <div class="cashier-total-divider"></div>
            <div class="cashier-grand-total">
              <span class="label">Tổng Cộng</span>
              <span class="amount" id="cashierGrandTotalValue">0₫</span>
            </div>

            <div class="cashier-payment-methods">
              <button class="cashier-payment-btn active">
                <i class="fa-solid fa-money-bill-wave"></i>
                Tiền Mặt
              </button>
              <button class="cashier-payment-btn">
                <i class="fa-solid fa-credit-card"></i>
                Chuyển Khoản
              </button>
              <button class="cashier-payment-btn">
                <i class="fa-solid fa-qrcode"></i>
                QR Code
              </button>
            </div>

            <div class="cashier-action-btns">
              <button class="cashier-icon-btn" title="Huỷ đơn">
                <i class="fa-solid fa-xmark"></i>
              </button>
              <button class="cashier-icon-btn" title="In hoá đơn">
                <i class="fa-solid fa-print"></i>
              </button>
              <button class="cashier-pay-btn">
                <i class="fa-solid fa-check"></i>
                Thanh Toán
              </button>
            </div>
          </div>
        </aside>
      </div>
    </div>

    <script src="Common.js?v=20260420a"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js"></script>
    <script src="CashierInterface.js?v=20260421a"></script>
  </body>
</html>
